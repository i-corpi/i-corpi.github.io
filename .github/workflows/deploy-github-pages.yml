name: Validate and deploy GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
  BUNDLE_FROZEN: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        baseurl: ['', '/project-preview']
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked site dependencies
        run: ./scripts/site setup
      - name: Install browser test dependencies
        run: |
          .venv/bin/python -m pip install -r requirements-test.txt
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Build production site
        run: |
          if [ -n '${{ matrix.baseurl }}' ]; then
            ./scripts/site build --baseurl '${{ matrix.baseurl }}'
          else
            ./scripts/site build
          fi
      - name: Validate pages and every local asset
        run: .venv/bin/python -m unittest tests/site_test.py -v
      - name: Test browser interactions
        run: ./scripts/site test-browser
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.baseurl == '' && 'root' || 'project' }}
          path: work/browser
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.baseurl == ''
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published revision and application pages
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/check_deployment.py "$PAGE_URL" --revision "$GITHUB_SHA"
