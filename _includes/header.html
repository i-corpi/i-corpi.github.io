<a class="skip-link" href="#main-content">Skip to content</a>
<header class="topbar">
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="i corpi home">
    <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
    <span>i corpi</span>
    <span class="brand-count">{{ site.data.models | size }}</span>
  </a>
  <nav aria-label="Main navigation">
    <a{% if page.nav == "archive" %} class="active" aria-current="page"{% endif %} href="{{ '/archive/' | relative_url }}">Archive</a>
    <a{% if page.nav == "gallery" %} class="active" aria-current="page"{% endif %} href="{{ '/gallery/' | relative_url }}">Gallery</a>
    <a{% if page.nav == "compare" %} class="active" aria-current="page"{% endif %} href="{{ '/compare/' | relative_url }}">Compare</a>
    <a{% if page.nav == "learn" %} class="active" aria-current="page"{% endif %} href="{{ '/learn/' | relative_url }}">Learn</a>
    <a{% if page.nav == "about" %} class="active" aria-current="page"{% endif %} href="{{ '/about/' | relative_url }}">About</a>
  </nav>
  <a class="topbar-source" href="https://github.com/{{ site.repository }}" target="_blank" rel="noreferrer">Source <span>↗</span></a>
</header>
