<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f0e8">
    <meta name="build-id" content="{{ site.build_id }}">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:image" content="{{ page.image | default: '/og.png' | absolute_url }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  </head>
  <body>
    <div class="site-shell{% if page.home %} home-shell{% endif %}">
      {% include header.html %}
      {{ content }}
      {% unless page.hide_footer %}{% include footer.html %}{% endunless %}
    </div>
    <script>
      window.ICORPI_BASE = {{ site.baseurl | default: "" | jsonify }};
    </script>
    {% if page.model_data %}
      <script id="model-data" type="application/json">{{ site.data.models | jsonify }}</script>
    {% endif %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    {% for script in page.scripts %}
      <script src="{{ script | relative_url }}" defer></script>
    {% endfor %}
  </body>
</html>
